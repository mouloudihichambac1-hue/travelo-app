apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
  namespace: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: travelo
  name: travelo-read-role
rules:
- apiGroups: ["", "apps", "extensions"]
  resources: ["pods", "services", "deployments", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-read-binding
  namespace: travelo
subjects:
- kind: ServiceAccount
  name: travelo-viewer
  namespace: travelo
roleRef:
  kind: Role
  name: travelo-read-role
  apiGroup: rbac.authorization.k8s.io